<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахта - Симулятор старателя</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #1a1a1a; --card-bg: #2d2d2d; --accent: #f1c40f;
            --success: #27ae60; --text-main: #ecf0f1; --text-muted: #95a5a6;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Verdana, sans-serif; }

        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            background-image: radial-gradient(#333 1px, transparent 1px); background-size: 20px 20px;
        }

        header {
            background-color: #111; padding: 20px; text-align: center; font-size: 24px;
            font-weight: bold; border-bottom: 3px solid #444; color: var(--accent);
            letter-spacing: 2px; text-transform: uppercase; box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            display: flex; justify-content: space-between; align-items: center;
        }

        .logout-btn { background: #c0392b; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; display: none; }

        .container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }

        /* Внутриигровые уведомления */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #222; color: var(--accent); padding: 15px 20px;
            border-radius: 8px; border: 2px solid var(--accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.9); z-index: 9999;
            font-weight: bold; text-align: center; font-size: 14px;
            display: none; transition: opacity 0.3s; width: 90%; max-width: 400px;
        }

        /* Модальное окно подтверждения вывода */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center;
        }
        .modal-box {
            background: var(--card-bg); padding: 25px; border-radius: 12px;
            border: 2px solid var(--accent); text-align: center; width: 90%; max-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        .modal-title { color: var(--accent); margin: 0 0 15px 0; font-size: 22px; text-transform: uppercase; }
        .modal-rate { font-size: 24px; font-weight: bold; margin: 20px 0; background: #111; padding: 15px; border-radius: 8px; }
        
        .modal-btn-confirm { background: var(--success); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px; text-transform: uppercase; box-shadow: 0 4px 0 #1e8449; transition: all 0.3s; }
        .modal-btn-confirm:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
        .modal-btn-confirm:disabled { background-color: #555; color: #999; box-shadow: 0 4px 0 #333; cursor: not-allowed; }

        .modal-btn-cancel { background: #c0392b; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; text-transform: uppercase; }

        /* Экраны */
        #auth-screen { display: flex; flex-direction: column; justify-content: center; height: 100%; }
        #game-screen { display: none; flex-direction: column; height: 100%; gap: 20px; }

        /* Формы авторизации */
        .auth-box { background: var(--card-bg); padding: 30px 20px; border-radius: 12px; border: 2px solid #555; text-align: center; }
        .auth-input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #555; background: #111; color: white; font-size: 16px; outline: none; }
        .auth-input:focus { border-color: var(--accent); }
        .auth-btn { width: 100%; background: var(--accent); color: black; border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 #b8960b; margin-bottom: 15px; }
        .auth-btn:active { transform: translateY(4px); box-shadow: none; }
        .auth-toggle { color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 14px; }

        /* Игровые элементы */
        .balance-card { background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%); border: 2px solid #555; border-radius: 12px; padding: 25px 20px; text-align: center; box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.8); }
        .balance-title { color: #bdc3c7; font-size: 14px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        .coins-amount { font-size: 46px; font-weight: 900; margin: 10px 0; color: var(--accent); text-shadow: 0 4px 10px rgba(0,0,0,0.6); }
        
        .action-btn { background-color: var(--card-bg); border: 2px solid #555; border-radius: 12px; padding: 15px; display: flex; align-items: center; width: 100%; text-align: left; color: var(--text-main); font-size: 16px; cursor: pointer; margin-bottom: 5px; box-shadow: 0 6px 0 #111; }
        .action-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #111; background-color: #222; }
        .action-icon { font-size: 32px; margin-right: 15px; background: #111; padding: 10px; border-radius: 10px; }
        .action-content { flex: 1; }
        .action-title { font-weight: bold; margin-bottom: 4px; font-size: 18px; }
        .action-reward { color: var(--accent); font-size: 14px; font-weight: bold; text-transform: uppercase; }
        
        .promo-container { display: flex; gap: 10px; }
        .promo-input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #555; background: var(--bg-color); color: white; font-size: 16px; outline: none; }
        .promo-btn { background: var(--accent); color: black; border: none; padding: 12px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #b8960b; }
        .promo-btn:active { transform: translateY(4px); box-shadow: none; }

        /* Главная кнопка вывода */
        .withdraw-btn-main { background-color: var(--success); color: white; border: none; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: bold; width: 100%; text-transform: uppercase; box-shadow: 0 6px 0 #1e8449; cursor: pointer; }
        .withdraw-btn-main:active { transform: translateY(6px); box-shadow: none; }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <div id="withdraw-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 class="modal-title">Сделка с торговцем</h3>
            <div style="color: #bdc3c7; font-size: 14px;">Текущий курс обмена:</div>
            <div class="modal-rate">100 000 🪙 = 0.50$</div>
            <button id="btn-modal-confirm" class="modal-btn-confirm" onclick="confirmPayout()">Подтвердить обмен</button>
            <button class="modal-btn-cancel" onclick="closeWithdrawModal()">Отмена</button>
        </div>
    </div>

    <header>
        <div>⛏️ ШАХТА</div>
        <button class="logout-btn" id="logout-btn" onclick="logout()">Выход</button>
    </header>

    <div class="container">
        <!-- ЭКРАН АВТОРИЗАЦИИ -->
        <div id="auth-screen">
            <div class="auth-box" id="login-box">
                <h2>Вход в гильдию</h2>
                <input type="email" id="login-email" class="auth-input" placeholder="Email">
                <input type="password" id="login-pass" class="auth-input" placeholder="Пароль">
                <button class="auth-btn" onclick="login()">Войти</button>
                <div class="auth-toggle" onclick="toggleAuth('register')">Нет аккаунта? Создать</div>
            </div>

            <div class="auth-box" id="register-box" style="display: none;">
                <h2>Регистрация</h2>
                <input type="email" id="reg-email" class="auth-input" placeholder="Email">
                <input type="password" id="reg-pass" class="auth-input" placeholder="Пароль (от 6 символов)">
                <button class="auth-btn" onclick="register()">Зарегистрироваться</button>
                <div class="auth-toggle" onclick="toggleAuth('login')">Уже есть аккаунт? Войти</div>
            </div>
        </div>

        <!-- ИГРОВОЙ ЭКРАН -->
        <div id="game-screen">
            <div class="balance-card">
                <div class="balance-title">Склад руды</div>
                <div class="coins-amount"><span id="coin-balance">0</span> 🪙</div>
            </div>

            <div>
                <button class="action-btn" id="btn-ad" onclick="watchAd()">
                    <div class="action-icon">🪨</div>
                    <div class="action-content">
                        <div class="action-title">Глубинная добыча</div>
                        <div class="action-reward">+100 🪙 (Просмотр)</div>
                    </div>
                </button>
            </div>

            <div>
                <div class="balance-title" style="margin-bottom: 10px;">Свиток гильдии (Промокод)</div>
                <div class="promo-container">
                    <input type="text" id="promo-input" class="promo-input" placeholder="Введите код...">
                    <button class="promo-btn" onclick="activatePromo()">Применить</button>
                </div>
            </div>

            <div style="margin-top: auto;">
                <button id="btn-withdraw" class="withdraw-btn-main" onclick="openWithdrawModal()">📦 Отправить груз торговцу</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCwkOhtJWzYdJHEAf3oN2ZRnOWzOcmo2CE",
            authDomain: "mine-3351608.firebaseapp.com",
            databaseURL: "https://mine-3351608-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "mine-3351608",
            storageBucket: "mine-3351608.firebasestorage.app",
            messagingSenderId: "762517836736",
            appId: "1:762517836736:web:96ce66ad50870f6999ee25",
            measurementId: "G-8CB3N7RPEF"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let userCoins = 0;
        let currentUser = null;
        const MIN_PAYOUT = 100000;

        const authScreen = document.getElementById('auth-screen');
        const gameScreen = document.getElementById('game-screen');
        const loginBox = document.getElementById('login-box');
        const registerBox = document.getElementById('register-box');
        const elCoinBalance = document.getElementById('coin-balance');
        const logoutBtn = document.getElementById('logout-btn');
        const modalConfirmBtn = document.getElementById('btn-modal-confirm');
        const withdrawModal = document.getElementById('withdraw-modal');

        function showToast(message) {
            var toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(function() {
                toast.style.display = 'none';
            }, 3000);
        }

        function toggleAuth(mode) {
            if (mode === 'register') {
                loginBox.style.display = 'none';
                registerBox.style.display = 'block';
            } else {
                registerBox.style.display = 'none';
                loginBox.style.display = 'block';
            }
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                authScreen.style.display = 'none';
                gameScreen.style.display = 'flex';
                logoutBtn.style.display = 'block';
                loadUserData(user.uid);
            } else {
                currentUser = null;
                gameScreen.style.display = 'none';
                logoutBtn.style.display = 'none';
                authScreen.style.display = 'flex';
            }
        });

        function register() {
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value;
            
            if (pass.length < 6) {
                showToast("Пароль должен быть не менее 6 символов!");
                return;
            }

            auth.createUserWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    return db.ref('users/' + userCredential.user.uid).set({ coins: 0 });
                })
                .catch((error) => {
                    if (error.code === 'auth/email-already-in-use') {
                        showToast("Этот Email уже зарегистрирован!");
                    } else {
                        showToast("Ошибка регистрации. Проверьте данные.");
                    }
                });
        }

        function login() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value;
            
            auth.signInWithEmailAndPassword(email, pass)
                .catch((error) => {
                    if (error.code === 'auth/user-not-found') {
                        showToast("Аккаунт не найден. Проверьте Email!");
                    } else if (error.code === 'auth/wrong-password') {
                        showToast("Неверный пароль!");
                    } else {
                        showToast("Ошибка входа. Проверьте данные.");
                    }
                });
        }

        function logout() {
            auth.signOut();
        }

        function loadUserData(uid) {
            db.ref('users/' + uid).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    userCoins = snapshot.val().coins || 0;
                } else {
                    userCoins = 0;
                }
                updateBalanceUI();
            });
        }

        function updateBalanceUI() {
            elCoinBalance.innerText = userCoins;
            
            if (userCoins >= MIN_PAYOUT) {
                modalConfirmBtn.disabled = false;
                modalConfirmBtn.innerText = "Подтвердить обмен";
            } else {
                modalConfirmBtn.disabled = true;
                modalConfirmBtn.innerText = "Недостаточно руды";
            }

            if (currentUser) {
                db.ref('users/' + currentUser.uid).update({ coins: userCoins });
            }
        }

        // --- ЗАЩИЩЕННАЯ ДОБЫЧА (Adsterra) ---
        let isMining = false; 
        let btnOriginalHTML = '';

        function watchAd() {
            var btnAd = document.getElementById('btn-ad');
            btnOriginalHTML = btnAd.innerHTML;
            
            btnAd.innerHTML = '<div style="text-align:center; width:100%; padding:10px 0; font-weight:bold;">⛏ Добыча... Вернитесь сюда за рудой!</div>';
            btnAd.disabled = true;

            // Открываем новую безопасную ссылку Adsterra
            var adWindow = window.open("https://araplhn.org/4/357835c9631ed01fb19fa589bbccdf5f", "_blank");

            if (!adWindow || adWindow.closed || typeof adWindow.closed === 'undefined') {
                showToast("Телефон заблокировал выход! Отключите блокировщик рекламы.");
                btnAd.innerHTML = btnOriginalHTML;
                btnAd.disabled = false;
                return;
            }

            isMining = true;
        }

        // Отслеживание возврата игрока в приложение
        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === 'visible' && isMining) {
                isMining = false; 
                
                setTimeout(() => {
                    giveReward(100); 
                    
                    var btnAd = document.getElementById('btn-ad');
                    if(btnAd) {
                        btnAd.innerHTML = btnOriginalHTML;
                        btnAd.disabled = false;
                    }
                }, 500);
            }
        });

        function giveReward(amount) {
            var earnedAmount = parseInt(amount);
            if (isNaN(earnedAmount)) earnedAmount = 100;
            
            userCoins += earnedAmount;
            updateBalanceUI();
            showToast('Поздравляем! Вы добыли ' + earnedAmount + ' 🪙 руды!');
        }

        function activatePromo() {
            var input = document.getElementById('promo-input');
            var code = input.value.trim().toLowerCase(); 
            
            if (code === 'admin') {
                userCoins += 100000;
                updateBalanceUI();
                showToast('Секретный код гильдии активирован! Получено 100 000 🪙');
            } else {
                showToast('Свиток не читается! Код неверный или уже просрочен.');
            }
            input.value = '';
        }

        function openWithdrawModal() {
            withdrawModal.style.display = 'flex';
        }

        function closeWithdrawModal() {
            withdrawModal.style.display = 'none';
        }

        function confirmPayout() {
            if (userCoins < MIN_PAYOUT) return;

            closeWithdrawModal();
            
            var message = "📦 Отправка груза торговцу!\n" +
                          "Добыто руды: " + userCoins + " 🪙\n" +
                          "Курс: 100 000 🪙 = 0.50$\n" +
                          "Email аккаунта: " + currentUser.email + "\n" +
                          "UID в базе: " + currentUser.uid;
            
            showToast("Караван отправлен! Открываем Telegram...");
            
            userCoins = 0;
            updateBalanceUI();
            
            setTimeout(function() {
                window.location.href = "https://t.me/oblivion_of_time?text=" + encodeURIComponent(message);
            }, 1500);
        }
    </script>
</body>
</html>
